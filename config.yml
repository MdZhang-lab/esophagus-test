seed: 42

data:
  files:
    - data/general.csv
    - data/protein.csv
    - data/blood.csv
  label_column: label
  target_column: target
  batch_size: 64
  num_workers: 0
  val_ratio: 0.2

model:
  n_blocks: 3
  backbone_kwargs: {}

optimizer:
  lr: 0.001
  weight_decay: 0.00001

trainer:
  num_epochs: 50
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  output_dir: ft_transformer
  run_name: heart_disease
  resume_from: null
